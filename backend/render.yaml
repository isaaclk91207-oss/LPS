services:
  - type: web
    name: cafe-point-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-point-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: cafe-point-db
    plan: free
    databaseName: cafe_point
    user: cafe_point_user
